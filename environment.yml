name: ultraplot-dev
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.15
  - numpy
  - matplotlib>=3.9
  - ffmpeg  # animation encoder for ultraplot.animation
  # CI/Nox omit Basemap for Matplotlib >=3.11; retain legacy/docs coverage here.
  - basemap >=1.4.1
  - cartopy
  - xarray
  - seaborn
  - pandas
  - pytest
  - pytest-mpl
  - pytest-cov
  - pytest-xdist
  - pip
  - pint
  - pre-commit
  - networkx
  - pyarrow
  - cftime
  - markdown
  - requests
  - pip:
      - mpltern
      - pycirclize
