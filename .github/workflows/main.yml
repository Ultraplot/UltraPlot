name: Matrix Test
on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

jobs:
  run-if-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'ultraplot/**'
              - 'pyproject.toml'
              - 'environment.yml'
              - '.github/workflows/**'
              - 'tools/ci/**'

  select-tests:
    runs-on: ubuntu-latest
    needs:
      - run-if-changes
    if: always() && needs.run-if-changes.outputs.run == 'true'
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      tests: ${{ steps.select.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare workspace
        run: mkdir -p .ci

      - name: Restore test map cache
        id: restore-map
        uses: actions/cache/restore@v6
        with:
          path: .ci/test-map.json
          key: test-map-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            test-map-

      - name: Build test map on cache miss
        if: steps.restore-map.outputs.cache-hit != 'true'
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: ./environment.yml
          init-shell: bash
          create-args: >-
            --verbose
            python=3.10
            matplotlib=3.9
          cache-environment: true
          cache-downloads: false

      - name: Generate test map on cache miss
        if: steps.restore-map.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          echo "Test map cache miss; generating map from tests."
          pip install --no-build-isolation --no-deps .
          mkdir -p .ci

          pytest -q --tb=short --disable-warnings -n auto -p pytest_cov \
            --cov=ultraplot \
            --cov-branch \
            --cov-context=test \
            --cov-report= \
            ultraplot/tests

          python tools/ci/build_test_map.py \
            --coverage-file .coverage \
            --output .ci/test-map.json \
            --root .

      - name: Select impacted tests
        id: select
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "tests=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.sha }} > .ci/changed.txt

          echo "Changed files:"
          cat .ci/changed.txt || true

          echo "Test map exists:"
          if [ -f .ci/test-map.json ]; then
            echo "yes (size=$(wc -c < .ci/test-map.json))"
          else
            echo "no"
          fi

          python tools/ci/select_tests.py \
            --map .ci/test-map.json \
            --changed-files .ci/changed.txt \
            --output .ci/selection.json \
            --always-full 'pyproject.toml' \
            --always-full 'environment.yml' \
            --always-full 'ultraplot/__init__.py' \
            --ignore 'docs/**' \
            --ignore 'README.rst'
          echo "Selection output:"
          cat .ci/selection.json || true

          python - <<'PY' > .ci/selection.out
          import json

          with open(".ci/selection.json", encoding="utf-8") as fh:
              data = json.load(fh)

          print(f"mode={data['mode']}")
          print(
              "tests="
              + json.dumps(
                  data.get("tests", []),
                  separators=(",", ":"),
              )
          )
          PY

          cat .ci/selection.out >> "$GITHUB_OUTPUT"

  get-versions:
    runs-on: ubuntu-latest
    needs:
      - run-if-changes
    if: always() && needs.run-if-changes.outputs.run == 'true'
    outputs:
      python-versions: ${{ steps.set-versions.outputs.python-versions }}
      matplotlib-versions: ${{ steps.set-versions.outputs.matplotlib-versions }}
      test-matrix: ${{ steps.set-versions.outputs.test-matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - id: set-versions
        run: |
          OUTPUT=$(python tools/ci/version_support.py)
          echo "Detected Python versions: $(echo "$OUTPUT" | jq -c '.python_versions')"
          echo "Detected Matplotlib versions: $(echo "$OUTPUT" | jq -c '.matplotlib_versions')"
          echo "Detected test matrix: $(echo "$OUTPUT" | jq -c '.test_matrix')"

          python tools/ci/version_support.py \
            --format github-output >> "$GITHUB_OUTPUT"

  #
  # Generate ONE canonical set of images.
  #
  # test-matrix[0] is deliberately the oldest supported
  # Python + Matplotlib combination.
  #
  visual-baseline:
    name: Generate canonical visual baseline
    runs-on: ubuntu-latest

    needs:
      - run-if-changes
      - get-versions

    if: >-
      always() &&
      needs.run-if-changes.outputs.run == 'true' &&
      needs.get-versions.result == 'success'

    defaults:
      run:
        shell: bash -el {0}

    env:
      PYTEST_WORKERS: 4
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg

      BASELINE_PYTHON: >-
        ${{ fromJson(needs.get-versions.outputs.test-matrix)[0]['python-version'] }}

      BASELINE_MATPLOTLIB: >-
        ${{ fromJson(needs.get-versions.outputs.test-matrix)[0]['matplotlib-version'] }}

    steps:
      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      #
      # Build the environment description while still on the PR/current
      # branch, i.e. from the version contract that produced our matrix.
      #
      - name: Prepare baseline environment
        run: |
          echo "Baseline Python: ${BASELINE_PYTHON}"
          echo "Baseline Matplotlib: ${BASELINE_MATPLOTLIB}"

          python3 tools/ci/version_support.py \
            --matplotlib-version "${BASELINE_MATPLOTLIB}" \
            --environment-output "${RUNNER_TEMP}/ultraplot-baseline-environment.yml"

      - name: Create baseline environment
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: ${{ runner.temp }}/ultraplot-baseline-environment.yml
          init-shell: bash
          condarc-file: ./.github/micromamba-condarc.yml
          post-cleanup: none
          create-args: >-
            --verbose
            python=${{ env.BASELINE_PYTHON }}
            matplotlib=${{ env.BASELINE_MATPLOTLIB }}
          cache-environment: true
          cache-downloads: false

      #
      # For a PR, the expected images must come from the base commit,
      # not from the PR itself.
      #
      # For a push to main/devel we use the pushed commit. This still
      # lets the newer matrix entries be compared against rendering
      # produced by the minimum supported environment.
      #
      - name: Checkout baseline commit
        id: baseline
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${GITHUB_SHA}"
          fi

          echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Generating baseline from ${BASE_SHA}"

          git checkout --detach "${BASE_SHA}"

      - name: Install baseline UltraPlot
        run: |
          pip install --no-build-isolation --no-deps .

          python - <<'PY'
          import sys
          import matplotlib

          print("Python:", sys.version)
          print("Matplotlib:", matplotlib.__version__)
          PY

      - name: Generate visual baseline
        run: |
          rm -rf ultraplot/tests/baseline
          mkdir -p ultraplot/tests/baseline

          python -c \
            "import ultraplot as plt; plt.config.Configurator()._save_yaml('ultraplot.yml')"

          echo "Generating baseline from:"
          echo "  commit:     ${{ steps.baseline.outputs.sha }}"
          echo "  Python:     ${BASELINE_PYTHON}"
          echo "  Matplotlib: ${BASELINE_MATPLOTLIB}"

          pytest \
            -n "${PYTEST_WORKERS}" \
            --dist loadfile \
            --tb=short \
            --disable-warnings \
            -W ignore \
            -m mpl_image_compare \
            --mpl-generate-path=./ultraplot/tests/baseline \
            --mpl-default-style=./ultraplot.yml \
            ultraplot/tests

      - name: Show generated baseline
        run: |
          echo "Generated baseline images:"
          find ultraplot/tests/baseline \
            -type f \
            -name '*.png' \
            | sort

          COUNT=$(find ultraplot/tests/baseline -type f -name '*.png' | wc -l)

          echo ""
          echo "Total images: ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "::error::No baseline images were generated"
            exit 1
          fi

      # pytest-mpl parameter IDs may contain characters (e.g. <lambda>)
      # that upload-artifact refuses as filenames. Archive the directory first.
      - name: Pack visual baseline
        run: |
          rm -f "${RUNNER_TEMP}/visual-baseline.tar"
          tar -C ultraplot/tests \
            -cf "${RUNNER_TEMP}/visual-baseline.tar" \
            baseline
          ls -lh "${RUNNER_TEMP}/visual-baseline.tar"

      - name: Upload visual baseline
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline
          path: ${{ runner.temp }}/visual-baseline.tar
          if-no-files-found: error
          compression-level: 0

  coverage:
    name: Coverage Python ${{ matrix.python-version }} / MPL ${{ matrix.matplotlib-version }}

    runs-on: ubuntu-latest

    needs:
      - run-if-changes
      - get-versions

    if: >-
      always() &&
      needs.run-if-changes.outputs.run == 'true' &&
      needs.get-versions.result == 'success' &&
      github.event_name == 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.get-versions.outputs.test-matrix) }}

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare compatible coverage environment
        run: >-
          python3 tools/ci/version_support.py
          --matplotlib-version '${{ matrix.matplotlib-version }}'
          --environment-output '${{ runner.temp }}/ultraplot-environment.yml'

      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: ${{ runner.temp }}/ultraplot-environment.yml
          init-shell: bash
          condarc-file: ./.github/micromamba-condarc.yml
          post-cleanup: none
          create-args: >-
            --verbose
            python=${{ matrix.python-version }}
            matplotlib=${{ matrix.matplotlib-version }}
          cache-environment: true
          cache-downloads: false

      - name: Build Ultraplot
        run: |
          pip install --no-build-isolation --no-deps .

      - name: Run full coverage suite
        run: |
          python - <<'PY'
          import sys
          from importlib.metadata import version

          import matplotlib
          import mpltern
          import pycirclize

          expected_python = tuple(
              map(int, '${{ matrix.python-version }}'.split('.'))
          )

          assert sys.version_info[:2] == expected_python
          assert matplotlib.__version__.startswith(
              '${{ matrix.matplotlib-version }}.'
          )

          print('Python executable:', sys.executable)

          for package in (
              'matplotlib',
              'mpltern',
              'pycirclize',
              'cartopy',
          ):
              print(f'{package}: {version(package)}')
          PY

          pytest \
            -q \
            --tb=short \
            --disable-warnings \
            -n auto \
            -p pytest_cov \
            --cov=ultraplot \
            --cov-branch \
            --cov-context=test \
            --cov-report=xml:coverage.xml \
            --cov-report= \
            ultraplot/tests

  #
  # IMPORTANT:
  #
  # Every matrix invocation waits for visual-baseline.
  # Therefore visual-baseline is guaranteed to exist before the
  # reusable workflow attempts to download it.
  #
  build:
    needs:
      - get-versions
      - run-if-changes
      - select-tests
      - visual-baseline

    if: >-
      always() &&
      needs.run-if-changes.outputs.run == 'true' &&
      needs.get-versions.result == 'success' &&
      needs.select-tests.result == 'success' &&
      needs.visual-baseline.result == 'success'

    strategy:
      matrix:
        include: ${{ fromJson(needs.get-versions.outputs.test-matrix) }}
      fail-fast: false
      max-parallel: 4

    uses: ./.github/workflows/build-ultraplot.yml

    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.ref }}-${{ matrix.python-version }}-${{ matrix.matplotlib-version }}
      cancel-in-progress: false

    with:
      python-version: ${{ matrix.python-version }}
      matplotlib-version: ${{ matrix.matplotlib-version }}
      test-mode: ${{ needs.select-tests.outputs.mode }}
      test-nodeids: ${{ needs.select-tests.outputs.tests }}

  build-success:
    needs:
      - build
      - coverage
      - visual-baseline
      - run-if-changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ '${{ needs.run-if-changes.outputs.run }}' == 'false' ]]; then
            echo "No changes detected, tests skipped."
            exit 0
          fi

          if [[ '${{ needs.visual-baseline.result }}' != 'success' ]]; then
            echo "Visual baseline generation failed."
            exit 1
          fi

          if [[ '${{ needs.build.result }}' == 'success' ]] && \
             [[ '${{ needs.coverage.result }}' == 'success' || \
                '${{ needs.coverage.result }}' == 'skipped' ]]; then
            echo "All tests passed successfully!"
          else
            echo "Tests failed!"
            exit 1
          fi
