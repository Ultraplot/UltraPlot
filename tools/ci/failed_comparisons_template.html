<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UltraPlot Image comparison</title>
  <style>
    body {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 24px;
      font: 15px/1.5 system-ui, sans-serif;
      color: #242424;
      background: #fff;
    }
    h1 { font-size: 1.7rem; margin: 0 0 8px; }
    h2 { font-size: 1.1rem; margin: 0 0 8px; overflow-wrap: anywhere; }
    a { color: #24589a; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .overview { color: #555; margin: 0 0 8px; }
    .files { margin: 0 0 32px; font-size: .9rem; }
    .comparison { padding: 22px 0 26px; border-top: 1px solid #ddd; }
    .metrics { margin: 0 0 16px; color: #555; font-size: .9rem; }
    .images { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin-bottom: 8px; font-weight: 600; font-size: .9rem; }
    figure a { display: block; }
    figure img {
      display: block;
      max-width: 100%;
      width: 100%;
      height: auto;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }
    .missing { color: #777; font-style: italic; }
    details { margin-top: 14px; }
    summary { cursor: pointer; }
    pre {
      font-size: .82rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 12px;
      background: #f5f5f5;
      border: 1px solid #e5e5e5;
    }
    .junit { border-top: 1px solid #ddd; padding-top: 16px; margin-bottom: 32px; }
    .junit li { overflow-wrap: anywhere; }
    @media (max-width: 700px) {
      body { margin: 24px auto; padding: 0 16px; }
      .images { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>UltraPlot Image comparison</h1>
  <p class="overview">__ULTRAPLOT_IMAGE_COUNT__ failed image comparisons; __ULTRAPLOT_JUNIT_COUNT__ JUnit failures/errors.</p>
  <p class="files"><a href="results.json">results.json</a>__ULTRAPLOT_JUNIT_DOWNLOAD__</p>
  <main>
    __ULTRAPLOT_CARDS__
    __ULTRAPLOT_JUNIT_DETAILS__
  </main>
</body>
</html>
